<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PerformanceGuard 自适应降级演示</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef2f7;
        color: #172033;
      }
      body { margin: 0; padding: 24px; }
      main { max-width: 1100px; margin: 0 auto; }
      .grid { display: grid; grid-template-columns: 1.3fr .7fr; gap: 18px; }
      .card { background: white; border: 1px solid #dce3ee; border-radius: 14px; padding: 18px; box-shadow: 0 10px 28px rgba(24, 39, 75, .08); }
      canvas { width: 100%; height: 280px; display: block; border-radius: 10px; background: radial-gradient(circle at 50% 35%, #263a63, #0b1220); }
      body.no-animations canvas { animation: none; }
      .badge { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 12px; font-weight: 700; background: #e8f8ef; color: #116534; }
      .badge::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #16a34a; }
      .badge.level-1 { background: #fff7df; color: #925f00; }
      .badge.level-1::before { background: #eab308; }
      .badge.level-2, .badge.level-3 { background: #ffecec; color: #a33; }
      .badge.level-2::before, .badge.level-3::before { background: #ef4444; }
      .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
      .metric { background: #f7f9fc; border-radius: 10px; padding: 12px; }
      .metric strong { display: block; font-size: 22px; margin-top: 4px; }
      .small { color: #64708b; font-size: 13px; }
      button { border: 0; border-radius: 9px; padding: 10px 12px; margin: 4px 6px 4px 0; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
      button.secondary { background: #475569; }
      button:hover { filter: brightness(1.05); }
      ul { padding-left: 20px; }
      code { background: #f1f5f9; padding: 2px 5px; border-radius: 5px; }
      @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>PerformanceGuard 自适应降级演示</h1>
      <div class="grid">
        <section class="card">
          <canvas id="scene" width="760" height="300"></canvas>
          <div class="metrics">
            <div class="metric"><span class="small">FPS</span><strong id="fps">--</strong></div>
            <div class="metric"><span class="small">堆内存占用</span><strong id="memory">不支持</strong></div>
            <div class="metric"><span class="small">轮询间隔</span><strong id="polling">--</strong></div>
          </div>
          <button id="longTask">模拟连续长任务</button>
          <button id="lowFps" class="secondary">模拟持续低 FPS</button>
          <button id="stopLoad" class="secondary">停止负载</button>
          <p class="small">长任务只在阈值连续出现两次后降级；恢复需连续 4 个采样点并经过冷却期，避免抖动。</p>
        </section>
        <aside class="card">
          <span id="level" class="badge">L0 正常</span>
          <h3>当前策略</h3>
          <ul>
            <li>动画：<code id="animations">开启</code></li>
            <li>Canvas：<code id="scale">100%</code></li>
            <li>缓存：<code id="cache">保留</code></li>
            <li>长任务：<code id="longtask">--</code></li>
          </ul>
          <h3>能力检测</h3>
          <ul>
            <li>performance.memory：<code id="memorySupport">--</code></li>
            <li>PerformanceObserver：<code id="observerSupport">--</code></li>
            <li>Worker：<code id="workerSupport">--</code></li>
            <li>requestIdleCallback：<code id="idleSupport">--</code></li>
          </ul>
        </aside>
      </div>
    </main>
    <script type="module" src="./demo/app.js"></script>
  </body>
</html>
